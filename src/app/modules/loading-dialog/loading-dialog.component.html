<div class="flex-container">
  <h1 mat-dialog-title>Processing Request</h1>
  <app-progress-bar
    class="container-dialog"
    progressMode="indeterminate"
    progressText="{{message}}"
  ></app-progress-bar>
  @if (showCancelButton) {
    <div mat-dialog-actions>
      @if (!disableCancelLoading) {
        <button
          id="loading-cancel-button"
          mat-button
          (click)="onCancelClick()"
          style="margin-right: 5px"
          color="warn"
          >
          Cancel loading
        </button>
      }
      @if (disableCancelLoading) {
        <div class="disable-cancel-button-message">
          Loading is almost finished, cancel button is now disable to terminate the process.
        </div>
      }
    </div>
  }
</div>
