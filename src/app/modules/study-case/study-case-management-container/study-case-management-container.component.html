<mat-tab-group class="container-workspace"  [(selectedIndex)]="index" (selectedTabChange)="selectedTabChanged($event)">
  <mat-tab [label]="studyManagementTitle">
    @if (showStudyManagement) {
      <app-study-case-management></app-study-case-management>
    }
  </mat-tab>
  <mat-tab [label]="referenceManagementTitle">
    @if (showReferenceManagement) {
      <app-reference-management></app-reference-management>
    }
  </mat-tab>
</mat-tab-group>
